# Configuración de Nginx para el frontend
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Todo lo que empiece con /api/ se reenvía al contenedor "backend".
    # La barra final en proxy_pass QUITA el prefijo: /api/Auth/Login -> /Auth/Login
    # (hace lo mismo que el proxy de vite.config.ts en desarrollo)
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router: cualquier ruta que no sea un archivo real devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
